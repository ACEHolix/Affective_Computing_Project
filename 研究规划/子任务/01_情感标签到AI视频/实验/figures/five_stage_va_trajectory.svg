<text x="600.00" y="36.00" font-size="26" font-weight="bold" fill="#222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Five-Stage Valence-Arousal Trajectory (Schematic)</text>
<text x="600.00" y="60.00" font-size="15" font-weight="normal" fill="#555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Based on the revised five-stage design for Subtask 01</text>
