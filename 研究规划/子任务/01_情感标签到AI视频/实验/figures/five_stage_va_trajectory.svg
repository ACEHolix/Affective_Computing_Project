<text x="408.00" y="74.00" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stage 2 / Positive Softening</text>
<text x="620.00" y="74.00" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stage 3 / Low-arousal Negative Shift</text>
<text x="832.00" y="74.00" font-size="13" font-weight="normal" fill="#333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stage 4 / Negative Escalation</text>
